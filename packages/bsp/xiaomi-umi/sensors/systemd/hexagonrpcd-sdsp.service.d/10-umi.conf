# Umi (Mi 10) serves its sensor registry from the device tree under
# /usr/share/qcom/sm8250/Xiaomi/umi via the -R root override. The daemon
# itself carries the apollo-sensor-fixes (rooted HexagonFS + PD fixes);
# without them SLPI crash-loops and takes the system down.
[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd-umi -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8250/Xiaomi/umi
