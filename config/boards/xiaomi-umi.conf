# Generate kernel and rootfs image for Qcom ABL booting
declare -g BOARD_NAME="Xiaomi Umi"
declare -g BOARD_MAINTAINER="Zhao_Wang"
declare -g INTRODUCED="2020"
declare -g BOARDFAMILY="sm8250"
declare -g KERNEL_TARGET="current,edge"
declare -g KERNEL_TEST_TARGET="edge"
declare -g EXTRAWIFI="no"
declare -g MODULES="spi-geni-qcom"
declare -g BOOTCONFIG="none"
declare -g BOOTIMG_CMDLINE_EXTRA="clk_ignore_unused pd_ignore_unused"
declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g -a ABL_DTB_LIST=("sm8250-xiaomi-umi")

# Use the full firmware, complete linux-firmware plus Armbian's (for qcom/a650_sqe.fw)
declare -g BOARD_FIRMWARE_INSTALL="-full"

# Path to the SDX55 modem userspace glue (cross-compiled + Debian-packaged, see modem/README)
declare -g -r UMI_MODEM_BSP="${SRC}/packages/bsp/xiaomi-umi/modem"
declare -g -r UMI_MODEM_MM_DEB="${UMI_MODEM_BSP}/modemmanager_1.24.0-1+deb13u1umi1_arm64.deb"
# Sensors userspace: patched hexagonrpcd (apollo-sensor-fixes, rooted HexagonFS),
# stock units + drop-ins, and the sensor registry tree for HexagonFS.
declare -g -r UMI_SENSORS_BSP="${SRC}/packages/bsp/xiaomi-umi/sensors"
# Cross-compiled linux-msm/pd-mapper (build via packages/bsp/xiaomi-umi/pd-mapper/debian-pkg/build.sh).
# REQUIRED for audio: it makes the ADSP "avs/audio" PD announce via PDR; without
# it no APR audio service device is created and the sm8250 sound card never binds.
declare -g -r UMI_PDMAPPER_DEB="${SRC}/packages/bsp/xiaomi-umi/pd-mapper/umi-pd-mapper_1.0-umi1_arm64.deb"

function xiaomi-umi_is_userspace_supported() {
	[[ "${RELEASE}" == "jammy" ]] && return 0
	[[ "${RELEASE}" == "trixie" ]] && return 0
	[[ "${RELEASE}" == "noble" ]] && return 0
	return 1
}

#
# SDX55 external modem (mobile data) userspace: binaries, units, udev rules,
# glue scripts. Firmware itself (sdx55m/) comes via userpatches overlay.
# Structure mirrors the Mi 10T pmOS modem package layout (same SDX55m modem).
#
function post_family_tweaks_bsp__xiaomi-umi_modem() {
	[[ "${RELEASE}" == "trixie" ]] || return 0 # MM deb is trixie-built
	if [[ ! -f "${UMI_MODEM_MM_DEB}" ]]; then
		display_alert "ModemManager deb missing" "${UMI_MODEM_MM_DEB}" "warn"
		return 0
	fi
	display_alert "$BOARD" "Install SDX55 modem userspace glue" "info"

	local dstbin="/usr/bin" dstunit="/usr/lib/systemd/system"

	# Cross-compiled helper daemons (pm-service shim, ESOC mdm_helper, EFS sync,
	# TFTP/RFS server for QRTR instance 3, diag tools)
	install -Dm755 "${UMI_MODEM_BSP}"/bin/pm_service_native     "$destination${dstbin}/"
	install -Dm755 "${UMI_MODEM_BSP}"/bin/mdm_helper_native     "$destination${dstbin}/"
	install -Dm755 "${UMI_MODEM_BSP}"/bin/mhi_efs_sync          "$destination${dstbin}/"
	install -Dm755 "${UMI_MODEM_BSP}"/bin/tqftpserv-sdx55       "$destination${dstbin}/"
	install -Dm755 "${UMI_MODEM_BSP}"/bin/diag_reader           "$destination${dstbin}/"
	install -Dm755 "${UMI_MODEM_BSP}"/bin/adsp_diag             "$destination${dstbin}/"

	# Shell glue: EFS extraction from partitions, USIM provisioning, MM restart loop
	install -Dm755 "${UMI_MODEM_BSP}"/scripts/umi-efs-extract      "$destination${dstbin}/"
	install -Dm755 "${UMI_MODEM_BSP}"/scripts/umi-uim-provision    "$destination${dstbin}/"
	install -Dm755 "${UMI_MODEM_BSP}"/scripts/umi-mm-restart-once  "$destination${dstbin}/"

	# systemd units
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/pm-service-native.service          "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/mdm-helper-native.service          "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/tqftpserv-sdx55.service            "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/mhi-efs-sync.service               "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/adsp-diag.service                  "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/umi-efs-extract.service         "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/umi-uim-provision.service       "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/ModemManager-restart-once.service  "$destination${dstunit}/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/umi-esoc-start.service             "$destination${dstunit}/"

	# ModemManager drop-ins: ordering vs the modem daemons + force QMAP multiplex
	mkdir -p "$destination${dstunit}/ModemManager.service.d"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/10-umi-modem-ordering.conf "$destination${dstunit}/ModemManager.service.d/"
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/zz-umi-multiplex.conf      "$destination${dstunit}/ModemManager.service.d/"

	# udev: fuse QRTR control + mhi_net data into one MM device, ignore EFS port
	install -Dm644 "${UMI_MODEM_BSP}"/udev/77-mm-ignore-sdx55-efs.rules "$destination/usr/lib/udev/rules.d/"
	install -Dm644 "${UMI_MODEM_BSP}"/udev/77-mm-sdx55-fusion.rules     "$destination/usr/lib/udev/rules.d/"

	# Kernel modules the modem stack needs (armbian config has them =m)
	install -Dm644 "${UMI_MODEM_BSP}"/umi-modem.conf.modules "$destination/usr/lib/modules-load.d/umi-modem.conf"

	# Preset (documents enablement; explicit enable happens in post_family_tweaks)
	install -Dm644 "${UMI_MODEM_BSP}"/systemd/umi-modem.preset "$destination/usr/lib/systemd/system-preset/umi-modem.preset"

	# timesyncd by IP (no writable RTC on this board) + NM dispatcher nudge
	install -Dm644 "${UMI_MODEM_BSP}"/timesyncd/10-umi-ntp-by-ip.conf "$destination/usr/lib/systemd/timesyncd.conf.d/"
	install -Dm755 "${UMI_MODEM_BSP}"/dispatcher/90-umi-timesyncd     "$destination/etc/NetworkManager/dispatcher.d/"

	# The tqftpserv RFS path mapping needs the sdx55m firmware exactly here;
	# overlay ships it flat (kernel sahara loader: "sdx55m/sbl1.mbn").
	# NB: the modem_pr symlink into the modem partition is created by the
	# tqftpserv-sdx55.service ExecStartPre at boot.
	return 0
}

function post_family_tweaks_bsp__xiaomi-umi_sensors() {
	[[ "${RELEASE}" == "trixie" ]] || return 0 # binaries built for trixie glibc
	if [[ ! -f "${UMI_SENSORS_BSP}/bin/hexagonrpcd-umi" ]]; then
		display_alert "hexagonrpcd-umi binary missing" "${UMI_SENSORS_BSP}" "warn"
		return 0
	fi
	display_alert "$BOARD" "Install SLPI sensor userspace (patched hexagonrpcd)" "info"

	# Daemon carries the apollo-sensor-fixes (rooted HexagonFS via -R, PD fixes).
	# Debian has no hexagonrpcd package, so we ship libhexagonrpc + chrecd too.
	install -Dm755 "${UMI_SENSORS_BSP}"/bin/hexagonrpcd-umi "$destination/usr/bin/"
	install -Dm755 "${UMI_SENSORS_BSP}"/bin/chrecd "$destination/usr/bin/"
	install -Dm755 "${UMI_SENSORS_BSP}"/lib/libhexagonrpc.so.0.4 "$destination/usr/lib/"

	# Stock upstream units + umi drop-ins (ExecStart -> hexagonrpcd-umi).
	install -Dm644 "${UMI_SENSORS_BSP}"/systemd/hexagonrpcd-sdsp.service "$destination/usr/lib/systemd/system/"
	install -Dm644 "${UMI_SENSORS_BSP}"/systemd/hexagonrpcd-adsp-rootpd.service "$destination/usr/lib/systemd/system/"
	install -Dm644 "${UMI_SENSORS_BSP}"/systemd/hexagonrpcd-adsp-sensorspd.service "$destination/usr/lib/systemd/system/"
	for s in hexagonrpcd-sdsp hexagonrpcd-adsp-rootpd hexagonrpcd-adsp-sensorspd; do
		install -Dm644 "${UMI_SENSORS_BSP}"/systemd/$s.service.d/10-umi.conf \
			"$destination/usr/lib/systemd/system/$s.service.d/10-umi.conf"
	done

	# Sensor registry tree served by HexagonFS (from stock firmware, no
	# per-device data; see sensors/README.md).
	mkdir -p "$destination/usr/share/qcom/sm8250/Xiaomi"
	cp -a "${UMI_SENSORS_BSP}"/firmware/sm8250/Xiaomi/umi "$destination/usr/share/qcom/sm8250/Xiaomi/"

	# Accelerometer mount matrix (libssc / iio-sensor-proxy). Starting
	# value from the Mi 10T reference; verify orientation on device.
	install -Dm644 "${UMI_SENSORS_BSP}"/udev/81-libssc-xiaomi-umi.rules \
		"$destination/usr/lib/udev/rules.d/81-libssc-xiaomi-umi.rules"

	# fastrpc nodes need the fastrpc group: Debian has no hexagonrpc
	# package carrying this rule (pmOS has one).
	install -Dm644 "${UMI_SENSORS_BSP}"/udev/60-fastrpc-umi.rules \
		"$destination/usr/lib/udev/rules.d/60-fastrpc-umi.rules"

	# fastrpc has to be up before hexagonrpcd-sdsp evaluates its
	# ConditionPathExists=/dev/fastrpc-sdsp.
	install -Dm644 "${UMI_SENSORS_BSP}"/modules-load/umi-sensors.conf \
		"$destination/usr/lib/modules-load.d/umi-sensors.conf"
	return 0
}

function post_family_tweaks_bsp__xiaomi-umi_firmware() {
	display_alert "$BOARD" "Install firmwares for xiaomi umi" "info"

	# Alsa-ucm-conf profile for Xiaomi Umi (Mi 10T TDM/RCV/LCV architecture;
	# matches the 0510 sound node). Card short name is "X10" (long name
	# "Xiaomi Mi 10"); alsa-lib versions differ on which one they look up,
	# so install the pmOS-style master dir plus both conf.d symlinks.
	mkdir -p "$destination/usr/share/alsa/ucm2/Xiaomi-Mi-10" \
		 "$destination/usr/share/alsa/ucm2/conf.d/sm8250"
	install -Dm644 $SRC/packages/bsp/xiaomi-umi/audio/ucm/"Xiaomi Mi 10.conf" \
		"$destination/usr/share/alsa/ucm2/Xiaomi-Mi-10/Xiaomi Mi 10.conf"
	install -Dm644 $SRC/packages/bsp/xiaomi-umi/audio/ucm/HiFi.conf \
		"$destination/usr/share/alsa/ucm2/Xiaomi-Mi-10/HiFi.conf"
	install -Dm644 $SRC/packages/bsp/xiaomi-umi/audio/ucm/VoiceCall.conf \
		"$destination/usr/share/alsa/ucm2/Xiaomi-Mi-10/VoiceCall.conf"
	ln -sfv "../../Xiaomi-Mi-10/Xiaomi Mi 10.conf" \
		"$destination/usr/share/alsa/ucm2/conf.d/sm8250/X10.conf"
	ln -sfv "../../Xiaomi-Mi-10/Xiaomi Mi 10.conf" \
		"$destination/usr/share/alsa/ucm2/conf.d/sm8250/Xiaomi Mi 10.conf"

	# Voice-call calibrations + AVCS custom topologies (loaded by the
	# built-in q6voice/q6core drivers via the qcom/umi-* firmware names).
	install -Dm644 $SRC/packages/bsp/xiaomi-umi/audio/firmware/qcom/umi-avcs-custom-topologies.bin \
		$destination/lib/firmware/qcom/umi-avcs-custom-topologies.bin
	for f in q6voice-cal q6voice-vol-cal q6voice-devcfg q6voice-stream-cal; do
		install -Dm644 $SRC/packages/bsp/xiaomi-umi/audio/firmware/qcom/$f.bin \
			$destination/lib/firmware/qcom/$f.bin
	done

	# q6cvp topology selection for calls (RX uses the board's custom
	# topology from the AVCS blob, TX stays NONE per the Mi 10T findings).
	install -Dm644 $SRC/packages/bsp/xiaomi-umi/audio/systemd/umi-voice-topology.service \
		$destination/usr/lib/systemd/system/

	# config file used by service hexagonrpcd-sdsp (umi's own SLPI/sensors fw dir)
	install -Dm644 $SRC/packages/bsp/xiaomi-umi/hexagonrpcd-sdsp $destination/etc/conf.d/hexagonrpcd-sdsp

	# USB Gadget Network service
	mkdir -p $destination/usr/local/bin/
	mkdir -p $destination/usr/lib/systemd/system/
	mkdir -p $destination/etc/initramfs-tools/scripts/init-bottom/
	install -Dm655 $SRC/packages/bsp/usb-gadget-network/setup-usbgadget-network.sh $destination/usr/local/bin/
	install -Dm655 $SRC/packages/bsp/usb-gadget-network/remove-usbgadget-network.sh $destination/usr/local/bin/
	install -Dm644 $SRC/packages/bsp/usb-gadget-network/usbgadget-rndis.service $destination/usr/lib/systemd/system/
	#install -Dm655 $SRC/packages/bsp/usb-gadget-network/usb-gadget-initramfs-hook $destination/etc/initramfs-tools/hooks/usb-gadget
	#install -Dm655 $SRC/packages/bsp/usb-gadget-network/usb-gadget-initramfs-premount $destination/etc/initramfs-tools/scripts/init-premount/usb-gadget
	#install -Dm655 $SRC/packages/bsp/usb-gadget-network/dropbear $destination/etc/initramfs-tools/scripts/init-premount/
	#install -Dm655 $SRC/packages/bsp/usb-gadget-network/kill-dropbear $destination/etc/initramfs-tools/scripts/init-bottom/

	# Bluetooth MAC addr setup service
	install -Dm655 $SRC/packages/bsp/generate-bt-mac-addr/bt-fixed-mac.sh $destination/usr/local/bin/
	install -Dm644 $SRC/packages/bsp/generate-bt-mac-addr/bt-fixed-mac.service $destination/usr/lib/systemd/system/

	# Kernel postinst script to update abl boot partition (umi-optimized)
	install -Dm655 $SRC/packages/bsp/xiaomi-umi/zz-update-abl-kernel $destination/etc/kernel/postinst.d/
	
	# Add umi firmwares
	#mkdir -p $destination/lib/firmware/qcom/sm8250/umi
	#install -Dm644 $SRC/packages/bsp/xiaomi-umi/a650_zap.mbn $destination/lib/firmware/qcom/sm8250/umi/
	#install -Dm644 $SRC/packages/bsp/xiaomi-umi/adsp.mbn $destination/lib/firmware/qcom/sm8250/umi/
	#install -Dm644 $SRC/packages/bsp/xiaomi-umi/adspr.jsn $destination/lib/firmware/qcom/sm8250/umi/
	#install -Dm644 $SRC/packages/bsp/xiaomi-umi/adspua.jsn $destination/lib/firmware/qcom/sm8250/umi/
	#install -Dm644 $SRC/packages/bsp/xiaomi-umi/cdspr.jsn $destination/lib/firmware/qcom/sm8250/umi/
	#install -Dm644 $SRC/packages/bsp/xiaomi-umi/cdsp.mbn $destination/lib/firmware/qcom/sm8250/umi/
	#install -Dm644 $SRC/packages/bsp/xiaomi-umi/venus.mbn $destination/lib/firmware/qcom/sm8250/umi/
}


function post_family_tweaks__xiaomi-umi_enable_services() {
	if ! xiaomi-umi_is_userspace_supported; then
		if [[ "${RELEASE}" != "" ]]; then
			display_alert "Missing userspace for ${BOARD}" "${RELEASE} does not have the userspace necessary to support the ${BOARD}" "warn"
		fi
		return 0
	fi

	if [[ "${RELEASE}" == "jammy" ]] || [[ "${RELEASE}" == "noble" ]]; then
		display_alert "Adding qcom-mainline PPA" "${BOARD}" "info"
		do_with_retries 3 chroot_sdcard_apt_get_install software-properties-common
		do_with_retries 3 chroot_sdcard add-apt-repository ppa:liujianfeng1994/qcom-mainline --yes --no-update
	fi

	# We need unudhcpd from armbian repo, so enable it
	mv "${SDCARD}"/etc/apt/sources.list.d/armbian.sources.disabled "${SDCARD}"/etc/apt/sources.list.d/armbian.sources

	do_with_retries 3 chroot_sdcard_apt_get_update
	display_alert "$BOARD" "Installing board tweaks" "info"
	do_with_retries 3 chroot_sdcard_apt_get_install alsa-ucm-conf qbootctl qrtr-tools unudhcpd mkbootimg dropbear-bin

	# Install hexagonrpc userspace service (same as elish)
	if [[ "${RELEASE}" == "noble" ]]; then
		do_with_retries 3 chroot_sdcard_apt_get_install hexagonrpc
		chroot_sdcard systemctl enable hexagonrpcd-sdsp.service
	fi

	# Disable armbian repo back
	if [ -f "${SDCARD}"/etc/apt/sources.list.d/armbian.list ]; then
		mv "${SDCARD}"/etc/apt/sources.list.d/armbian.list "${SDCARD}"/etc/apt/sources.list.d/armbian.list.disabled
	elif [ -f "${SDCARD}"/etc/apt/sources.list.d/armbian.sources ]; then
		mv "${SDCARD}"/etc/apt/sources.list.d/armbian.sources "${SDCARD}"/etc/apt/sources.list.d/armbian.sources.disabled
	fi
	do_with_retries 3 chroot_sdcard_apt_get_update

	chroot_sdcard systemctl enable qbootctl.service
	chroot_sdcard systemctl enable usbgadget-rndis.service
	chroot_sdcard systemctl enable bt-fixed-mac.service

	#
	# SDX55 mobile data (trixie only: the patched ModemManager deb is trixie-built)
	#
	if [[ "${RELEASE}" == "trixie" && -f "${UMI_MODEM_MM_DEB}" ]]; then
		display_alert "$BOARD" "Installing SDX55 modem stack" "info"

		# Runtime deps: qmicli (USIM provisioning), NetworkManager (MM bearer owner).
		# qrtr-tools is installed above and provides qrtr-ns + libqrtr1.
		do_with_retries 3 chroot_sdcard_apt_get_install libqmi-utils network-manager

		# Patched ModemManager (qcom-soc plugin accepts mhi_net data ports; WDS
		# bind-mux on PCIe endpoints). Pulls in the stock libmm-glib0/libqmi/mbim/polkit.
		install_deb_chroot "${UMI_MODEM_MM_DEB}"
		chroot_sdcard apt-mark hold modemmanager

		# Enable the modem bring-up chain (units installed via bsp hook above).
		# Order matters and is encoded in the units themselves
		# (pm-service/mdm-helper -> tqftpserv -> efs -> uim -> ModemManager).
		chroot_sdcard systemctl enable pm-service-native.service
		chroot_sdcard systemctl enable mdm-helper-native.service
		chroot_sdcard systemctl enable tqftpserv-sdx55.service
		chroot_sdcard systemctl enable umi-efs-extract.service
		chroot_sdcard systemctl enable mhi-efs-sync.service
		chroot_sdcard systemctl enable umi-uim-provision.service
		chroot_sdcard systemctl enable umi-esoc-start.service
		chroot_sdcard systemctl enable ModemManager.service
		chroot_sdcard systemctl enable ModemManager-restart-once.service
		# adsp-diag is optional (F3 log capture); leave disabled by default.

		#
		# pd-mapper: the ADSP audio PD announces its APR services only
		# after the userspace PD mapper registers the domain maps.
		#
		display_alert "$BOARD" "Installing pd-mapper (audio PD announcement)" "info"
		if [[ -f "${UMI_PDMAPPER_DEB}" ]]; then
			do_with_retries 3 chroot_sdcard_apt_get_install libqrtr1
			install_deb_chroot "${UMI_PDMAPPER_DEB}"
			chroot_sdcard systemctl enable pd-mapper.service
		else
			display_alert "pd-mapper deb missing" "${UMI_PDMAPPER_DEB}" "warn"
		fi

		#
		# Sensors: SLPI fastrpc daemon (patched hexagonrpcd) + sensor registry.
		# The stock adsp units self-disable on umi (ConditionPathExists=
		# !/dev/fastrpc-sdsp); the sdsp unit is the one that serves.
		#
		display_alert "$BOARD" "Enabling SLPI sensor userspace" "info"
		if ! grep -q "^fastrpc:" "${SDCARD}/etc/group"; then
			chroot_sdcard adduser --system --group --no-create-home --home /nonexistent fastrpc
		fi
		chroot_sdcard ldconfig
		chroot_sdcard systemctl enable hexagonrpcd-sdsp.service
		# Voice-call topology selection (q6cvp module params; q6cvp =y).
		chroot_sdcard systemctl enable umi-voice-topology.service
		return 0
	fi
	return 0
}

function post_family_tweaks_bsp__xiaomi-umi_bsp_firmware_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: firmware in initrd" "info"
	declare file_added_to_bsp_destination
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/hooks/xiaomi-umi-firmware" <<- 'FIRMWARE_HOOK'
		#!/bin/bash
		[[ "$1" == "prereqs" ]] && exit 0
		. /usr/share/initramfs-tools/hook-functions
		for f in /lib/firmware/qcom/sm8250/umi/* ; do
			add_firmware "${f#/lib/firmware/}"
		done
		add_firmware "qcom/a650_sqe.fw" # extra one for dpu
		add_firmware "qcom/a650_gmu.bin" # extra one for gpu
		# SDX55 modem: ESOC/MHI may need to re-load AMSS after a late
		# modem reset, so keep the boot images in the initramfs.
		# efs*.bin are absent on purpose (per-device, extracted on first boot).
		for f in /lib/firmware/qcom/sdx55m/sbl1.mbn \
		         /lib/firmware/qcom/sdx55m/multi_image.mbn \
		         /lib/firmware/qcom/sdx55m/aop.mbn \
		         /lib/firmware/qcom/sdx55m/qdsp6sw.mbn \
		         /lib/firmware/qcom/sdx55m/devcfg.mbn \
		         /lib/firmware/qcom/sdx55m/mdmddr.mbn ; do
			[ -f "$f" ] && add_firmware "${f#/lib/firmware/}"
		done
	FIRMWARE_HOOK
	run_host_command_logged chmod -v +x "${file_added_to_bsp_destination}"
}

## Modules, required to boot, add them to initrd
function post_family_tweaks_bsp__xiaomi-umi_bsp_modules_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: modules in initrd" "info"
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/modules" <<- 'EXTRA_MODULES'
		spi-geni-qcom
		qrtr
		qrtr-mhi
		mhi_wwan_ctrl
		mhi_net
		rmnet
	EXTRA_MODULES
}