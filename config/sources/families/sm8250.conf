declare -g LINUXFAMILY="sm8250"
declare -g OVERLAY_DIR="/boot/dtb/qcom/overlay"
declare -g ARCH="arm64"
declare -g BOOTENV_FILE="qcom-abl.txt"
enable_extension "image-output-abl"

case $BRANCH in

	current)
		declare -g KERNEL_MAJOR_MINOR="7.2"
		# PINNED to v7.2.11: linux-7.2.y moved to 7.2.12 which boot-loops on umi
		# (2026-10-23). Revert to 'branch:linux-7.2.y' after bisecting the regression.
		declare -g KERNELBRANCH='commit:a2de78ee6ed8bf8cd99d177c74865a6e8c3cb6ea'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELBRANCH='branch:linux-6.18.y'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		;;

esac

family_tweaks_bsp() {
	:
}